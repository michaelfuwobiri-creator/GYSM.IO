<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#07060b" />
  <title>Nollywood</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="app" class="app">
    <div id="stage" class="stage" aria-hidden="true"></div>

    <nav id="rail" class="rail" aria-label="Main">
      <div class="rail__logo"><span class="n-mark">N</span><span class="rail__word">NOLLYWOOD</span></div>
      <div class="rail__items">
        <button class="rail__item" data-nav data-group="rail" data-route="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Search</span></button>
        <button class="rail__item" data-nav data-group="rail" data-route="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="currentColor"/></svg><span>Home</span></button>
        <button class="rail__item" data-nav data-group="rail" data-route="series"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 21h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Series</span></button>
        <button class="rail__item" data-nav data-group="rail" data-route="movies"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3 9h18M8 4l2 5M14 4l2 5" stroke="currentColor" stroke-width="2"/></svg><span>Movies</span></button>
        <button class="rail__item" data-nav data-group="rail" data-route="list"><svg viewBox="0 0 24 24"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.5L5 21V4.5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span>My List</span></button>
      </div>
      <button class="rail__item rail__account" data-nav data-group="rail" data-route="account"><span class="rail__avatar"><svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.3L21 9l-5 4.4L17.4 20 12 16.6 6.6 20 8 13.4 3 9l6.4-.7z" fill="currentColor"/></svg></span><span id="rail-account-label">Sign in</span></button>
    </nav>

    <main id="screen" class="screen" data-scroller></main>
    <div id="overlays"></div>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
