plugins {
    id "com.android.application"
}

android {
    namespace "tv.nollywood.app"
    compileSdk 34

    defaultConfig {
        applicationId "tv.nollywood.app"
        minSdk 25        // Fire OS 6 and later
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
