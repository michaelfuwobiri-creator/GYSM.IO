name: Build Fire TV APK

# Builds the Fire TV app in stream/android. Every run produces a debug APK
# for sideloading. When the four signing secrets below are set, it also
# produces a signed release APK for the Amazon Appstore.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   FIRETV_KEYSTORE_BASE64   base64 of your .jks file:  base64 -w0 gysm-release.jks
#   FIRETV_KEYSTORE_PASSWORD
#   FIRETV_KEY_ALIAS         e.g. gysm
#   FIRETV_KEY_PASSWORD

on:
  push:
    branches: [claude/gifted-hawking-98io3u]
    paths:
      - "stream/web/**"
      - "stream/android/**"
      - ".github/workflows/firetv-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firetv-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.FIRETV_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Write signing key
        if: env.HAS_KEY == 'true'
        working-directory: stream/android
        run: |
          echo "${{ secrets.FIRETV_KEYSTORE_BASE64 }}" | base64 -d > gysm-release.jks
          cat > keystore.properties <<EOF
          storeFile=gysm-release.jks
          storePassword=${{ secrets.FIRETV_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.FIRETV_KEY_ALIAS }}
          keyPassword=${{ secrets.FIRETV_KEY_PASSWORD }}
          EOF

      - name: Build debug APK
        working-directory: stream/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        working-directory: stream/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Remove signing key
        if: always()
        working-directory: stream/android
        run: rm -f gysm-release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: gysm-stream-debug-apk
          path: stream/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: gysm-stream-release-apk
          path: stream/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
